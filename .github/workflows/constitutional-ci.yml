name: Constitutional CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Revision to compare for manual validation"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: constitutional-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  constitutional-evidence:
    name: Constitutional evidence classifier and runner
    runs-on: ubuntu-latest
    environment: testing
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: classroom_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Self-check evidence manifest
        run: |
          set -o pipefail
          python scripts/ci_evidence_runner.py --self-check \
            | tee constitutional-ci-selfcheck.json

      - name: Collect changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "Unable to establish a valid base revision."
            exit 2
          fi
          git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > changed_paths.txt
          if [ ! -s changed_paths.txt ]; then
            echo "No changed paths were discovered; classifier must fail closed."
            exit 2
          fi

      - name: Run constitutional evidence runner
        env:
          TEST_DATABASE_URL: postgresql://user:password@localhost:5432/classroom_test_db
          DATABASE_URL: postgresql://user:password@localhost:5432/classroom_test_db
          FLASK_APP: app
          FLASK_ENV: testing
          SECRET_KEY: test-secret
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          PEPPER_KEY: ${{ secrets.PEPPER_KEY }}
          ADMIN_PII_KEY: ${{ secrets.ADMIN_PII_KEY }}
          STUDENT_PII_KEY: ${{ secrets.STUDENT_PII_KEY }}
        run: |
          set -o pipefail
          python scripts/ci_evidence_runner.py \
            --paths-file changed_paths.txt \
            --pytest python \
            | tee constitutional-ci-result.json

      - name: Publish constitutional result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: constitutional-ci-result
          path: |
            constitutional-ci-result.json
            constitutional-ci-selfcheck.json
            changed_paths.txt
          if-no-files-found: error

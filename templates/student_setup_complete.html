<!-- templates/student_setup_complete.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Complete | Classroom Token Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">

    <link href="{{ static_url('css/tokens.css') }}" rel="stylesheet">
    <link href="{{ static_url('css/style.css') }}" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, var(--info) 0%, var(--info) 50%, var(--info) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            padding: 1.5rem;
        }
        .card {
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 20px 60px color-mix(in srgb, var(--primary) 25%, transparent);
            background-color: white;
            text-align: center;
            max-width: 520px;
            width: 100%;
        }
        h1 {
            font-size: 1.75rem;
            margin-bottom: 1rem;
            color: var(--primary);
            font-weight: 700;
        }
        p {
            color: var(--text-secondary);
            margin: 0;
        }
        .btn-primary {
            margin-top: 1.5rem;
            background: linear-gradient(135deg, var(--info) 0%, var(--info) 100%);
            border: none;
            font-weight: 600;
            padding: 0.85rem 1.25rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px color-mix(in srgb, var(--info) 30%, transparent);
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, var(--info) 0%, var(--primary-hover) 100%);
        }
        @media (max-width: 576px) {
            body {
                padding: 1rem;
            }

            .card {
                padding: 1.75rem;
            }

        .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 48
        }

        }
    </style>
</head>
<body class="student-theme">
    <main id="main-content" aria-labelledby="setup-complete-heading">
    <div class="card">
         <span class="material-symbols-outlined" aria-hidden="true" style="font-size:50pt; color:var(--success)">check_circle</span><br>
        <h1 id="setup-complete-heading">Hello, {{ student_name }}!</h1>
        <p style="font-size:15pt">Welcome to <strong>Classroom Token Hub</strong></p>
        <a href="{{ url_for('student.dashboard') }}" class="btn btn-primary">Thanks, Let's Go!</a>
    </div>
    </main>
</body>
</html>
